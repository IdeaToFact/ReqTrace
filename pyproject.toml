[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reqtrace"
version = "0.2.0"
description = "Grounded Requirements Traceability & Audit Gap Copilot for Regulated Engineering (DO-178C, DO-254, ISO 26262, IEC 62304)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [
    { name = "Idea To Fact LLC", email = "contact@ideatofact.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "defusedxml>=0.7.1",
    "pypdfium2>=4.28.0",
    "python-docx>=1.1.0",
    "rapidfuzz>=3.6.0",
    "rank-bm25>=0.2.2",
    "fastembed>=0.2.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.28.0",
    "filelock>=3.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pip-licenses>=4.3.0",
]

[project.scripts]
reqtrace = "reqtrace.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.hatch.build.targets.wheel]
packages = ["reqtrace"]

