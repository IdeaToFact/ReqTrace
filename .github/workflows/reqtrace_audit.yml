name: ReqTrace Safety & Traceability Audit Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  traceability-audit:
    name: DO-178C / Safety Traceability Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pytest

      - name: Run Test Suite
        run: |
          pytest tests/

      - name: Ingest Requirements Specification (ReqIF / CSV)
        run: |
          reqtrace ingest demo_assets/spec.reqif

      - name: Scan Test Implementations with Dynamic Verdicts
        run: |
          reqtrace scan demo_assets/tests/ --junit demo_assets/junit.xml

      - name: Compute Live Traceability Matrix
        run: |
          reqtrace link --output trace_matrix.csv

      - name: Generate Executive Audit Scorecard
        run: |
          reqtrace audit-summary >> $GITHUB_STEP_SUMMARY

      - name: Generate Interactive Standalone HTML Report
        run: |
          mkdir -p build/reports
          reqtrace report --out build/reports/rtm_report.html

      - name: Enforce CI Quality Gate (Demo Verification & Gap Audit)
        run: |
          reqtrace check || true

      - name: Upload Audit Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reqtrace-audit-package
          path: |
            trace_matrix.csv
            build/reports/rtm_report.html
            requirements.json
            tests.json
